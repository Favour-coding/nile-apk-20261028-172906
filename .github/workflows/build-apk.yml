name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f yarn.lock ]; then
            npm install -g yarn && yarn install --frozen-lockfile
          elif [ -f pnpm-lock.yaml ]; then
            npm install -g pnpm && pnpm install --frozen-lockfile
          else
            npm install
          fi
      - name: Build web project
        run: npm run build
      - name: Copy web build output to Android assets
        run: |
          OUT_DIR=""
          for candidate in dist build out; do
            if [ -f "$candidate/index.html" ]; then
              OUT_DIR="$candidate"
              break
            fi
          done
          if [ -z "$OUT_DIR" ]; then
            FOUND_INDEX=$(find . -maxdepth 3 -name "index.html" -not -path "*/node_modules/*" -not -path "*/android/*" | head -n 1)
            if [ -n "$FOUND_INDEX" ]; then
              OUT_DIR=$(dirname "$FOUND_INDEX")
            fi
          fi
          echo "Selected web build directory: $OUT_DIR"
          mkdir -p android/app/src/main/assets
          if [ -n "$OUT_DIR" ] && [ -d "$OUT_DIR" ]; then
            cp -r "$OUT_DIR"/* android/app/src/main/assets/
          else
            echo "Error: Could not locate build output containing index.html"
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace --no-daemon
        working-directory: android
      - name: Locate APK
        id: locate
        run: echo "apk=$(find android/app/build/outputs/apk/debug -name '*.apk' | head -n 1)" >> "$GITHUB_OUTPUT"
      - name: Sign APK with permanent key
        id: sign
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SIGNING_ALIAS: ${{ secrets.SIGNING_ALIAS }}
        run: |
          RAW_APK="${{ steps.locate.outputs.apk }}"
          if [ -z "$RAW_APK" ] || [ ! -f "$RAW_APK" ]; then
            echo "Error: Located APK not found at: $RAW_APK"
            exit 1
          fi

          if [ -z "$SIGNING_KEYSTORE_B64" ] || [ -z "$SIGNING_PASSWORD" ] || [ -z "$SIGNING_ALIAS" ]; then
            echo "Permanent signing secrets not present; publishing raw APK"
            echo "apk=$RAW_APK" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Decoding user permanent keystore..."
          echo "$SIGNING_KEYSTORE_B64" | base64 -d > user-signing.p12

          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "Using Android build-tools from: $BUILD_TOOLS_DIR"

          APK_DIR=$(dirname "$RAW_APK")
          APK_NAME=$(basename "$RAW_APK" .apk)
          ALIGNED_APK="$APK_DIR/$APK_NAME-aligned.apk"
          SIGNED_APK="$APK_DIR/$APK_NAME-signed.apk"

          echo "Running zipalign..."
          "$BUILD_TOOLS_DIR/zipalign" -v -p 4 "$RAW_APK" "$ALIGNED_APK" || cp "$RAW_APK" "$ALIGNED_APK"

          echo "Running apksigner with permanent user key..."
          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks user-signing.p12 \
            --ks-pass env:SIGNING_PASSWORD \
            --ks-key-alias "$SIGNING_ALIAS" \
            --key-pass env:SIGNING_PASSWORD \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"

          echo "Verifying APK signature..."
          "$BUILD_TOOLS_DIR/apksigner" verify "$SIGNED_APK"

          rm -f user-signing.p12
          echo "Permanent key signature applied successfully."
          echo "apk=$SIGNED_APK" >> "$GITHUB_OUTPUT"
      - name: Create release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Build #${{ github.run_number }}"
          files: ${{ steps.sign.outputs.apk || steps.locate.outputs.apk }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
